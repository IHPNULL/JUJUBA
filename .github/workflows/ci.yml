name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Test (diagnostic - gdb backtrace on crash)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          ulimit -c unlimited
          gdb --batch \
            -ex "handle SIGSEGV stop print" \
            -ex "run" \
            -ex "bt full" \
            -ex "thread apply all bt" \
            --args node node_modules/.bin/jest --ci --runInBand
